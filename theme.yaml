name: fuwari
version: 1.0.0
description: A modern blog theme for OpenOlah, ported from Halo theme-fuwari
author: OpenOlah Team
preview: /themes/fuwari/screenshot/home.png
settings:
  - key: site_title
    type: text
    default: "OpenOlah"
    description: "站点标题"
    required: false
  - key: site_description
    type: textarea
    default: "A modern blog powered by OpenOlah"
    description: "站点描述"
    required: false
  - key: posts_per_page
    type: number
    default: "10"
    description: "每页文章数"
    required: false
  - key: banner_enable
    type: checkbox
    default: "true"
    description: "启用 Banner"
    required: false
  - key: banner_src
    type: text
    default: "/themes/fuwari/assets/images/demo-banner.png"
    description: "Banner 图片地址"
    required: false
  - key: banner_position
    type: select
    default: "center"
    description: "Banner 图片位置"
    required: false
  - key: theme_color_hue
    type: number
    default: "250"
    description: "主题色相 (0-360)"
    required: false
  - key: color_scheme
    type: select
    default: "auto"
    description: "配色方案 (light/dark/auto)"
    required: false
  - key: toc_enable
    type: checkbox
    default: "true"
    description: "启用文章目录"
    required: false
  - key: author_name
    type: text
    default: "Author"
    description: "作者名称"
    required: false
  - key: author_bio
    type: textarea
    default: "Welcome to my blog!"
    description: "作者简介"
    required: false
  - key: author_avatar
    type: text
    default: "/themes/fuwari/assets/images/demo-avatar.png"
    description: "作者头像"
    required: false
  - key: author_url
    type: text
    default: "/about"
    description: "作者链接"
    required: false
  - key: icp_text
    type: text
    default: ""
    description: "ICP 备案号"
    required: false
  - key: icp_link
    type: text
    default: "https://beian.miit.gov.cn/"
    description: "ICP 备案链接"
    required: false
  - key: gongan_text
    type: text
    default: ""
    description: "公安备案号"
    required: false
  - key: gongan_link
    type: text
    default: "https://beian.mps.gov.cn/"
    description: "公安备案链接"
    required: false
  - key: theme_color_fixed
    type: checkbox
    default: "false"
    description: "固定主题色相，隐藏访客色相选择器"
    required: false
  - key: enable_change_color_scheme
    type: checkbox
    default: "true"
    description: "允许访客切换配色"
    required: false
  - key: banner_credit_enable
    type: checkbox
    default: "false"
    description: "启用 Banner 版权信息"
    required: false
  - key: banner_credit_text
    type: text
    default: "© Fuwari"
    description: "Banner 版权文字"
    required: false
  - key: banner_credit_url
    type: text
    default: ""
    description: "Banner 版权链接"
    required: false
  - key: post_license_enable
    type: checkbox
    default: "false"
    description: "启用文章版权声明"
    required: false
  - key: post_license_name
    type: text
    default: "CC BY-NC-SA 4.0"
    description: "版权声明名称"
    required: false
  - key: post_license_url
    type: text
    default: "https://creativecommons.org/licenses/by-nc-sa/4.0/"
    description: "版权声明链接"
    required: false
  - key: content_size
    type: select
    default: "prose-base"
    description: "文章字体大小"
    required: false
    options: "prose-base,prose-sm,prose-lg"

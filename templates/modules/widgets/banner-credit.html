{{ if .Site.BannerCreditUrl }}
<a
  href="{{ .Site.BannerCreditUrl }}"
  id="banner-credit"
  target="_blank"
  rel="noopener"
  aria-label="Visit image source"
  class="onload-animation group absolute -top-[3.25rem] right-4 flex h-9 items-center justify-center rounded-full bg-black/60 px-3 transition-all hover:bg-black/70 hover:pr-9 active:bg-black/80"
>
  <span class="icon-[material-symbols--copyright-outline-rounded] mr-1 text-[1.25rem] text-white/75"></span>
  <div class="text-xs text-white/75">{{ .Site.BannerCreditText }}</div>
  <span class="icon-[material-symbols--share-outline] absolute right-4 text-[0.75rem] text-[oklch(0.75_0.14_var(--hue))] opacity-0 transition group-hover:opacity-100">
  </span>
</a>
{{ else }}
<div
  id="banner-credit"
  class="onload-animation group absolute -top-[3.25rem] right-4 flex h-9 items-center justify-center rounded-full bg-black/60 px-3 transition-all hover:bg-black/70"
>
  <span class="icon-[material-symbols--copyright-outline-rounded] mr-1 text-[1.25rem] text-white/75"></span>
  <div class="text-xs text-white/75">{{ .Site.BannerCreditText }}</div>
</div>
{{ end }}
